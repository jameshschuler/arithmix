services:
  - type: web
    name: arithmix
    runtime: static
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    previews:
      generation: automatic
    envVars:
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: '0'
    routes:
      - type: rewrite
        source: /play
        destination: /index.html
      - type: rewrite
        source: /results/*
        destination: /index.html
      - type: rewrite
        source: /leaderboard
        destination: /index.html
      - type: rewrite
        source: /achievements
        destination: /index.html
      - type: rewrite
        source: /settings
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
